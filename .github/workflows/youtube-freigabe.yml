name: YouTube-Freigabe
# Stellt Videos öffentlich, sobald in automatik/youtube.json „freigabe“: "ja" steht (eingetragen von der
# Cowork-Aufgabe nach automatik/youtube/freigabe.md, von Hand auf GitHub oder mit freigeben.mjs).
on:
  push:
    branches: [main]
    paths: [automatik/youtube.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube
  cancel-in-progress: false
jobs:
  freigeben:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freigaben umsetzen
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node automatik/youtube/freigeben.mjs --anwenden
      - name: Stand sichern
        if: always()
        run: |
          git diff --quiet automatik/youtube.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "YouTube: Freigaben öffentlich gestellt" automatik/youtube.json
          git pull -q --rebase origin main && git push -q origin HEAD:main
